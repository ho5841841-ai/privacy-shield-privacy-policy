<script>
const D={
en:["English","Privacy Policy","Privacy Shield is an Android privacy analysis and network control application. This policy explains the data it processes and its limitations.",[
["App information and permissions","The Full Scan edition examines installed apps, package names, versions, installation metadata, permissions and special access status. Results, risk assessments and changes are stored locally. It does not read the content of another app's messages merely because that app has a sensitive permission."],
["VPN, network traffic and DNS","With permission, the local VPN processes device network traffic for filtering and connection controls. It can store connection metadata such as application identifier, source and destination addresses, ports, domains, timestamps, traffic volume and allow/block decisions in an encrypted local database. DNS query names are sent to Cloudflare DNS over HTTPS (cloudflare-dns.com/dns-query); Cloudflare can see the queried domain and source IP. Allowed traffic goes to its ordinary destinations. This is not a service for hiding your public IP address."],
["Screen-off and conversation controls","When VPN protection is active, screen-off rules can block known advertising, analytics and attribution domains. They do not disable every network connection or block microphone access. Conversation Protection applies stricter network filtering rules; Privacy Shield does not request Android's RECORD_AUDIO permission and does not itself record or transcribe phone conversations."],
["Bluetooth accessory","If you choose to connect a paired Bluetooth Low Energy accessory, the app uses its name/address and exchanges control commands, battery/temperature and status telemetry. Session metadata is kept locally. The accessory's independent firmware or audio-processing behavior has not been verified and is not covered by guarantees about the phone app."],
["Subscriptions","Yearly Premium subscriptions are offered through Google Play Billing. Google Play processes purchases and payment details. Privacy Shield checks signed purchase information, acknowledges purchases and stores local entitlement status and verification timestamps. It does not ask users to enter payment card numbers."],
["Local storage, retention and deletion","The app encrypts its local database with SQLCipher; preferences are also kept locally. Network and DNS history is generally trimmed toward approximately seven days with per-table limits of 50,000 records; pruning may be delayed until new events or scans. Inventory, preferences and rules may remain longer. In-app history cleanup deletes selected local history and may start a new scan. Clearing app data or uninstalling removes local app data, but cannot delete Cloudflare or Google Play records. Reports you choose to export as JSON are not encrypted by Privacy Shield; their later storage depends on the destination you select."],
["Third parties and data transfers","Cloudflare is used for DNS-over-HTTPS resolution; Google Play Billing handles subscription transactions. Ordinary allowed app traffic reaches its intended third-party destinations. No direct advertising, Firebase analytics or crash-reporting SDK was identified in the reviewed app declarations, but native Firestack and transitive SDK behavior has not been exhaustively verified."],
["Permissions and your choices","The app may use internet, network state, notifications, Bluetooth connect, foreground service, boot completion, and broad package visibility depending on edition and enabled functions. VPN requires Android's approval. You can stop VPN protection, avoid Bluetooth pairing, manage Premium via Google Play, and clear available local history."],
["Security and limitations","DNS-over-HTTPS encrypts DNS queries in transit to Cloudflare, and the local database is encrypted. Exported JSON reports are not automatically encrypted. No privacy tool can guarantee that all third-party tracking or secret listening is detected or prevented. Third-party provider retention and accessory firmware practices may differ."],
["Contact","For privacy requests or questions: cigdemkabakci01@gmail.com."]]],
tr:["Türkçe","Gizlilik Politikası","Privacy Shield, Android üzerinde gizlilik analizi ve ağ kontrolü sağlayan bir uygulamadır. Bu politika, işlenen verileri ve korumanın teknik sınırlarını açıklar.",[
["Uygulamalar ve izinler","Tam tarama sürümü kurulu uygulamaları, paket adlarını, sürümleri, kurulum bilgilerini, izin ve özel erişim durumlarını inceler. Analiz ve risk sonuçları cihazda saklanır. Başka bir uygulamanın mikrofon iznini görmesi, o uygulamanın konuşmalarını okuyabildiği anlamına gelmez."],
["VPN, ağ trafiği ve DNS","Kullanıcı onayıyla çalışan yerel VPN, ağ bağlantılarını filtreler. Uygulama kimliği, IP adresleri, portlar, alan adları, zaman, trafik miktarı ve izin/engel kararları şifrelenmiş yerel veritabanına kaydedilebilir. DNS sorguları HTTPS üzerinden Cloudflare'a iletilir; Cloudflare sorgulanan alan adını ve kaynak IP adresini görebilir. İzin verilen bağlantılar normal hedeflerine gider. VPN genel IP adresinizi gizleme hizmeti değildir."],
["Ekran kapalıyken ve konuşma koruması","VPN etkinken ekran kapalı kuralları bilinen reklam, analiz ve ilişkilendirme alan adlarını engelleyebilir. Bütün ağ bağlantılarını veya mikrofon erişimini durdurmaz. Conversation Protection ağ filtreleme kuralları uygular; uygulama Android RECORD_AUDIO izni istemez, telefon konuşmalarını kendi başına kaydetmez veya yazıya dökmez."],
["Bluetooth aksesuarı","Eşleşmiş bir BLE aksesuarını seçerseniz aygıt adı/adresi, komutlar ve pil, sıcaklık, durum bilgileri işlenir; oturum meta verileri yerel tutulur. Fiziksel aksesuarın kendi yazılımının ses işleme davranışı doğrulanmamıştır."],
["Abonelik","Yıllık Premium abonelik Google Play Billing üzerinden sunulur. Ödeme ayrıntılarını Google Play işler; uygulama satın alma doğrulaması ve yerel erişim durumunu yönetir. Kart numarası istemez."],
["Saklama, dışa aktarma ve silme","Yerel veritabanı SQLCipher ile şifrelenir. Ağ ve DNS geçmişi yaklaşık 7 gün ve tablo başına 50.000 kayıt sınırına göre temizlenir; temizleme gecikebilir. Uygulama envanteri ve tercihler daha uzun kalabilir. Geçmişi temizleme seçili yerel kayıtları siler ve yeniden tarama başlatabilir. Uygulamayı silmek veya verisini temizlemek yerel bilgileri kaldırır; Cloudflare ve Google Play kayıtlarını silmez. Kullanıcı tarafından dışa aktarılan JSON raporları Privacy Shield tarafından şifrelenmez."],
["Üçüncü taraflar","DNS çözümlemesi Cloudflare'a, abonelik işlemleri Google Play'e gider. İzin verilen uygulama trafiği normal hedeflerine ulaşır. İncelenen doğrudan bağımlılıklarda reklam veya Firebase analiz SDK'sı bulunmamıştır; yerel Firestack ve dolaylı SDK davranışları bütünüyle doğrulanmamıştır."],
["İzinler ve kontrolünüz","Sürüme ve etkin özelliklere göre internet, ağ durumu, bildirim, Bluetooth bağlantısı, ön plan hizmeti, açılışta yeniden başlatma ve kurulu uygulama görünürlüğü izinleri kullanılabilir. VPN için Android onayı gerekir. VPN'i kapatabilir, Bluetooth bağlantısından vazgeçebilir, yerel geçmişi temizleyebilir ve aboneliği Google Play'den yönetebilirsiniz."],
["Güvenlik ve sınırlamalar","DNS sorguları Cloudflare'a HTTPS üzerinden aktarılır; yerel veritabanı şifrelidir. Dışa aktarılan JSON kendiliğinden şifreli değildir. Hiçbir araç tüm izlemeleri veya gizli dinlemeleri kesin biçimde tespit ya da engelleme garantisi veremez. Harici aksesuar ve sağlayıcıların uygulamaları ayrıca değerlendirilmelidir."],
["İletişim","Gizlilik soruları için: cigdemkabakci01@gmail.com."]]],
de:["Deutsch","Datenschutzerklärung","Privacy Shield unterstützt die Analyse von App-Berechtigungen und die Kontrolle des Netzwerkverkehrs.",[["Apps und Berechtigungen","Die Vollscan-Version prüft installierte Apps, Metadaten und Berechtigungen und speichert Ergebnisse lokal."],["VPN und DNS","Das lokale VPN verarbeitet Verbindungsmetadaten und kann sie verschlüsselt auf dem Gerät speichern. DNS-Anfragen werden über HTTPS an Cloudflare übermittelt; Cloudflare kann Domainnamen und Quell-IP sehen. Zugelassene Verbindungen erreichen ihre normalen Ziele."],["Bildschirm und Gespräche","Bei ausgeschaltetem Bildschirm können bekannte Werbe- und Tracking-Domains blockiert werden. Conversation Protection ist ein Netzwerkfilter; die App zeichnet keine Telefongespräche auf und verlangt keine Mikrofonberechtigung."],["Bluetooth","Bei optionalem BLE-Zubehör verarbeitet die App Gerätekennung, Befehle und Statusdaten. Eigenständige Audiofunktionen des Zubehörs sind nicht verifiziert."],["Premium","Google Play Billing verarbeitet Jahresabonnements; die App speichert lokalen Zugriffsstatus, keine Kartennummern."],["Speicherung und Löschung","Die lokale Datenbank ist verschlüsselt. Netzwerkverlauf wird ungefähr sieben Tage lang gehalten und bei Verarbeitung bereinigt; andere lokale Daten können länger verbleiben. Exportierte JSON-Berichte sind nicht verschlüsselt. Löschen lokaler Daten entfernt keine Aufzeichnungen von Cloudflare oder Google Play."],["Dritte und Grenzen","Cloudflare löst DNS auf; Google Play verarbeitet Käufe. Der Schutz garantiert weder die Erkennung sämtlicher Tracker noch das Verhindern heimlicher Aufnahmen."],["Kontakt","cigdemkabakci01@gmail.com"]]],
fr:["Français","Politique de confidentialité","Privacy Shield aide à analyser les autorisations des applications et à contrôler les connexions réseau.",[["Applications","L'analyse complète examine les applications installées, leurs métadonnées et autorisations. Les résultats restent stockés localement."],["VPN et DNS","Le VPN local peut conserver des métadonnées de connexion dans une base chiffrée. Les requêtes DNS sont transmises à Cloudflare via HTTPS; Cloudflare peut voir les domaines demandés et l'adresse IP source. Le trafic autorisé rejoint ses destinations habituelles."],["Écran éteint et conversations","Les règles peuvent bloquer certains domaines publicitaires lorsque l'écran est éteint. Conversation Protection applique un filtrage réseau; l'application ne demande pas l'accès au microphone et n'enregistre pas les conversations."],["Bluetooth","Un accessoire BLE facultatif échange commandes et télémétrie. Le traitement audio autonome de cet accessoire n'est pas vérifié."],["Abonnement","Google Play Billing gère les abonnements annuels. L'application conserve un état d'accès local, pas les numéros de carte."],["Conservation et suppression","La base locale est chiffrée. Les journaux réseau sont généralement réduits vers sept jours; d'autres données peuvent rester plus longtemps. Les exports JSON ne sont pas chiffrés. La suppression locale n'efface pas les données détenues par Cloudflare ou Google."],["Limites","La protection ne garantit pas la détection de tout pistage ou de toute écoute cachée."],["Contact","cigdemkabakci01@gmail.com"]]],
es:["Español","Política de privacidad","Privacy Shield analiza los permisos de las aplicaciones y ofrece controles de red para proteger la privacidad.",[["Aplicaciones","La exploración completa revisa aplicaciones instaladas, metadatos y permisos. Los resultados se guardan localmente."],["VPN y DNS","La VPN local puede guardar metadatos de conexiones en una base cifrada. Las consultas DNS se envían por HTTPS a Cloudflare, que puede ver los dominios y la IP de origen. El tráfico permitido va a sus destinos habituales."],["Pantalla apagada y conversaciones","Las reglas pueden bloquear dominios de anuncios conocidos cuando la pantalla está apagada. Conversation Protection filtra la red; la app no solicita permiso de micrófono ni graba conversaciones."],["Bluetooth","Un accesorio BLE opcional intercambia órdenes y telemetría. No se ha verificado el procesamiento de audio propio del accesorio."],["Suscripción","Google Play Billing procesa la suscripción anual; la app guarda el estado de acceso, no números de tarjeta."],["Retención y eliminación","La base local está cifrada. El historial de red se depura aproximadamente a siete días, aunque otros datos pueden permanecer más. Los JSON exportados no se cifran. Borrar datos locales no elimina registros de Cloudflare o Google Play."],["Límites","No se garantiza detectar todos los rastreadores ni impedir toda escucha oculta."],["Contacto","cigdemkabakci01@gmail.com"]]],
"pt-BR":["Português (Brasil)","Política de Privacidade","O Privacy Shield ajuda a analisar permissões de aplicativos e controlar conexões de rede.",[["Aplicativos","A varredura completa examina aplicativos instalados, metadados e permissões. Os resultados ficam armazenados localmente."],["VPN e DNS","A VPN local pode armazenar metadados de conexões em banco criptografado. Consultas DNS são enviadas por HTTPS à Cloudflare, que pode ver domínios e IP de origem. Tráfego permitido segue para seus destinos normais."],["Tela desligada e conversas","Regras podem bloquear domínios conhecidos de publicidade com a tela desligada. Conversation Protection filtra a rede; o aplicativo não solicita microfone nem grava conversas."],["Bluetooth","Acessório BLE opcional troca comandos e telemetria; seu processamento independente de áudio não foi verificado."],["Assinatura","O Google Play Billing processa a assinatura anual; o aplicativo guarda o status local de acesso, não números de cartão."],["Retenção e exclusão","O banco local é criptografado. O histórico de rede é reduzido para cerca de sete dias; outros dados podem permanecer mais. Exportações JSON não são criptografadas. A exclusão local não remove registros da Cloudflare ou do Google Play."],["Limites","Não há garantia de detectar todo rastreamento ou impedir toda escuta oculta."],["Contato","cigdemkabakci01@gmail.com"]]],
it:["Italiano","Informativa sulla privacy","Privacy Shield aiuta a controllare autorizzazioni delle app e connessioni di rete.",[["App","La scansione completa esamina app installate, metadati e autorizzazioni. I risultati sono conservati sul dispositivo."],["VPN e DNS","La VPN locale può registrare metadati di connessione in un database cifrato. Le richieste DNS vengono inviate a Cloudflare tramite HTTPS; Cloudflare può vedere domini e IP sorgente. Il traffico consentito raggiunge le destinazioni ordinarie."],["Schermo spento e conversazioni","Le regole possono bloccare noti domini pubblicitari a schermo spento. Conversation Protection filtra la rete; l'app non richiede il microfono e non registra conversazioni."],["Bluetooth","Un accessorio BLE facoltativo scambia comandi e telemetria; l'elaborazione audio autonoma dell'accessorio non è verificata."],["Abbonamento","Google Play Billing elabora l'abbonamento annuale; l'app memorizza l'accesso locale, non i numeri delle carte."],["Conservazione e cancellazione","Il database locale è cifrato. I registri di rete sono ridotti a circa sette giorni; altri dati possono restare più a lungo. I JSON esportati non sono cifrati. La cancellazione locale non elimina i dati presso Cloudflare o Google Play."],["Limiti","Non è garantito il rilevamento di ogni tracciamento o l'impedimento di ascolti nascosti."],["Contatto","cigdemkabakci01@gmail.com"]]],
pl:["Polski","Polityka prywatności","Privacy Shield pomaga analizować uprawnienia aplikacji i kontrolować połączenia sieciowe.",[["Aplikacje","Pełne skanowanie sprawdza zainstalowane aplikacje, metadane i uprawnienia; wyniki są zapisywane lokalnie."],["VPN i DNS","Lokalny VPN może przechowywać metadane połączeń w szyfrowanej bazie danych. Zapytania DNS trafiają do Cloudflare przez HTTPS; firma może widzieć domeny i źródłowy adres IP. Dozwolony ruch dociera do zwykłych odbiorców."],["Wygaszony ekran i rozmowy","Reguły mogą blokować znane domeny reklamowe przy wyłączonym ekranie. Conversation Protection filtruje sieć; aplikacja nie wymaga mikrofonu i nie nagrywa rozmów."],["Bluetooth","Opcjonalne akcesorium BLE wymienia polecenia i telemetrię. Niezależne funkcje audio akcesorium nie zostały zweryfikowane."],["Subskrypcja","Google Play Billing obsługuje roczną subskrypcję; aplikacja zapisuje stan dostępu, nie numery kart."],["Przechowywanie i usuwanie","Lokalna baza jest szyfrowana. Historia sieci jest ograniczana do około siedmiu dni; inne dane mogą pozostać dłużej. Wyeksportowane pliki JSON nie są szyfrowane. Lokalne usunięcie nie kasuje danych Cloudflare ani Google Play."],["Ograniczenia","Nie gwarantujemy wykrycia każdego śledzenia ani powstrzymania ukrytego podsłuchu."],["Kontakt","cigdemkabakci01@gmail.com"]]],
ar:["العربية","سياسة الخصوصية","يساعد Privacy Shield على فحص أذونات التطبيقات والتحكم في اتصالات الشبكة.",[["التطبيقات","يفحص المسح الكامل التطبيقات المثبتة وأذوناتها وبياناتها الوصفية، وتُحفظ النتائج محليًا."],["VPN وDNS","قد تسجل شبكة VPN المحلية بيانات اتصال وصفية في قاعدة بيانات مشفرة. تُرسل استعلامات DNS عبر HTTPS إلى Cloudflare، وقد ترى أسماء النطاقات وعنوان IP المصدر. تصل الاتصالات المسموح بها إلى وجهاتها المعتادة."],["الشاشة المغلقة والمحادثات","يمكن للقواعد حظر نطاقات إعلانية معروفة عند إغلاق الشاشة. تطبق Conversation Protection قواعد تصفية للشبكة؛ لا يطلب التطبيق إذن الميكروفون ولا يسجل المحادثات."],["بلوتوث","يتبادل ملحق BLE اختياري الأوامر وبيانات الحالة. لم يتم التحقق من معالجة الصوت المستقلة للملحق."],["الاشتراك","يتولى Google Play Billing الاشتراك السنوي؛ يخزن التطبيق حالة الوصول محليًا وليس أرقام بطاقات الدفع."],["الاحتفاظ والحذف","قاعدة البيانات المحلية مشفرة. تُقلص سجلات الشبكة عادة إلى نحو سبعة أيام، وقد تبقى بيانات أخرى لمدة أطول. ملفات JSON المصدرة غير مشفرة. لا يؤدي الحذف المحلي إلى حذف سجلات Cloudflare أو Google Play."],["الحدود","لا يمكن ضمان كشف جميع وسائل التتبع أو منع كل استماع خفي."],["الاتصال","cigdemkabakci01@gmail.com"]]],
ja:["日本語","プライバシーポリシー","Privacy Shieldはアプリの権限を調べ、ネットワーク通信を管理するAndroidアプリです。",[["アプリ情報","フルスキャンではインストール済みアプリの情報と権限を確認し、分析結果を端末内に保存します。"],["VPNとDNS","ローカルVPNは通信メタデータを暗号化された端末内データベースに保存することがあります。DNS問い合わせはHTTPSでCloudflareへ送信され、同社はドメインと送信元IPを確認できる場合があります。許可された通信は通常の宛先へ進みます。"],["画面オフと会話","画面オフ時に既知の広告ドメインをブロックできます。Conversation Protectionは通信フィルターであり、アプリはマイク権限を要求せず、会話を録音しません。"],["Bluetooth","任意のBLEアクセサリーと指示・状態情報を交換します。アクセサリー自身の音声処理は未検証です。"],["購読","年間購読はGoogle Play Billingが処理し、アプリは利用権限の状態を保存します。カード番号は保存しません。"],["保存と削除","ローカルDBは暗号化されます。通信履歴は通常約7日を目安に整理されますが、他の情報は長く残る場合があります。エクスポートしたJSONは暗号化されません。端末内で削除してもCloudflareやGoogle Playの記録は消えません。"],["制限","すべての追跡や秘密録音を検出・防止できる保証はありません。"],["連絡先","cigdemkabakci01@gmail.com"]]],
ko:["한국어","개인정보 처리방침","Privacy Shield는 앱 권한을 분석하고 네트워크 연결을 관리하는 Android 앱입니다.",[["앱 정보","전체 검사는 설치된 앱의 메타데이터와 권한을 확인하며 결과를 기기에 저장합니다."],["VPN 및 DNS","로컬 VPN은 연결 메타데이터를 암호화된 로컬 데이터베이스에 저장할 수 있습니다. DNS 요청은 HTTPS로 Cloudflare에 전달되며 도메인과 원본 IP가 보일 수 있습니다. 허용된 트래픽은 원래 목적지로 전달됩니다."],["화면 꺼짐 및 대화","화면이 꺼졌을 때 알려진 광고 도메인을 차단할 수 있습니다. Conversation Protection은 네트워크 필터로, 마이크 권한을 요청하거나 대화를 녹음하지 않습니다."],["Bluetooth","선택한 BLE 액세서리와 명령 및 상태 정보를 교환합니다. 액세서리 자체의 오디오 처리는 확인되지 않았습니다."],["구독","연간 구독은 Google Play Billing을 통해 처리되며 앱은 로컬 이용 권한 상태를 저장합니다. 카드 번호는 저장하지 않습니다."],["보관 및 삭제","로컬 DB는 암호화됩니다. 네트워크 기록은 일반적으로 약 7일을 기준으로 정리되지만 다른 데이터는 더 오래 남을 수 있습니다. 내보낸 JSON은 암호화되지 않습니다. 로컬 삭제로 Cloudflare나 Google Play의 기록이 삭제되지는 않습니다."],["한계","모든 추적이나 은밀한 녹음을 탐지 또는 차단한다고 보장하지 않습니다."],["연락처","cigdemkabakci01@gmail.com"]]],
id:["Bahasa Indonesia","Kebijakan Privasi","Privacy Shield membantu meninjau izin aplikasi dan mengelola koneksi jaringan di Android.",[["Aplikasi","Pemindaian penuh membaca metadata serta izin aplikasi terpasang dan menyimpan hasilnya secara lokal."],["VPN dan DNS","VPN lokal dapat menyimpan metadata koneksi dalam basis data terenkripsi. Permintaan DNS dikirim melalui HTTPS ke Cloudflare, yang mungkin melihat domain dan IP sumber. Koneksi yang diizinkan menuju tujuan biasanya."],["Layar mati dan percakapan","Aturan dapat memblokir domain iklan yang dikenal saat layar mati. Conversation Protection menggunakan filter jaringan; aplikasi tidak meminta izin mikrofon atau merekam percakapan."],["Bluetooth","Aksesori BLE opsional bertukar perintah dan telemetri. Pengolahan audio mandiri aksesori belum diverifikasi."],["Langganan","Google Play Billing memproses langganan tahunan; aplikasi menyimpan status akses lokal, bukan nomor kartu."],["Penyimpanan dan penghapusan","Basis data lokal terenkripsi. Riwayat jaringan biasanya dipangkas hingga sekitar tujuh hari; data lain dapat tersimpan lebih lama. Laporan JSON yang diekspor tidak dienkripsi. Penghapusan lokal tidak menghapus catatan Cloudflare atau Google Play."],["Batasan","Tidak ada jaminan semua pelacakan atau penyadapan tersembunyi dapat dideteksi atau dicegah."],["Kontak","cigdemkabakci01@gmail.com"]]],
hi:["हिन्दी","गोपनीयता नीति","Privacy Shield Android पर ऐप अनुमतियों की जाँच और नेटवर्क नियंत्रण में मदद करता है।",[["ऐप जानकारी","पूर्ण स्कैन इंस्टॉल किए गए ऐप, उनके मेटाडेटा और अनुमतियाँ जाँचता है; परिणाम डिवाइस पर रखे जाते हैं।"],["VPN और DNS","स्थानीय VPN कनेक्शन संबंधी मेटाडेटा एन्क्रिप्टेड स्थानीय डेटाबेस में रख सकता है। DNS प्रश्न HTTPS द्वारा Cloudflare को भेजे जाते हैं, जो डोमेन और स्रोत IP देख सकता है। अनुमत ट्रैफ़िक अपने सामान्य गंतव्य पर जाता है।"],["स्क्रीन बंद और बातचीत","स्क्रीन बंद होने पर ज्ञात विज्ञापन डोमेन रोके जा सकते हैं। Conversation Protection नेटवर्क फ़िल्टर है; ऐप माइक्रोफ़ोन अनुमति नहीं माँगता और बातचीत रिकॉर्ड नहीं करता।"],["Bluetooth","वैकल्पिक BLE उपकरण के साथ आदेश और स्थिति का आदान-प्रदान होता है। उपकरण का स्वतंत्र ऑडियो व्यवहार सत्यापित नहीं है।"],["सदस्यता","वार्षिक सदस्यता Google Play Billing संचालित करता है। ऐप स्थानीय पहुँच की स्थिति रखता है, कार्ड नंबर नहीं।"],["संग्रह और हटाना","स्थानीय डेटाबेस एन्क्रिप्टेड है। नेटवर्क इतिहास सामान्यतः लगभग सात दिन के अनुसार हटाया जाता है; अन्य डेटा अधिक समय रह सकता है। निर्यात की गई JSON फ़ाइलें एन्क्रिप्टेड नहीं हैं। स्थानीय डेटा हटाने से Cloudflare या Google Play के रिकॉर्ड नहीं मिटते।"],["सीमाएँ","सभी ट्रैकिंग या छिपी रिकॉर्डिंग का पता लगाने या रोकने की गारंटी नहीं है।"],["संपर्क","cigdemkabakci01@gmail.com"]]],
"zh-TW":["繁體中文","隱私權政策","Privacy Shield 是協助檢查應用程式權限與管理網路連線的 Android 工具。",[["應用程式","完整掃描會檢查已安裝應用程式的資料與權限，結果儲存在裝置本機。"],["VPN 與 DNS","本機 VPN 可能將連線中繼資料記錄於加密資料庫。DNS 查詢透過 HTTPS 傳送至 Cloudflare；對方可能看到查詢網域與來源 IP。允許的流量會前往原本目的地。"],["關閉螢幕與對話","螢幕關閉時可封鎖部分已知廣告網域。Conversation Protection 是網路過濾功能；應用程式不要求麥克風權限，也不錄製對話。"],["Bluetooth","選用的 BLE 配件交換控制指令和狀態資訊；配件獨立的音訊處理尚未驗證。"],["訂閱","年度訂閱由 Google Play Billing 處理；本機只記錄使用權狀態，不保存卡號。"],["保存及刪除","本機資料庫已加密。網路紀錄通常按約七日清理，其他資料可能保留更久。匯出的 JSON 未加密。刪除本機資料不會刪除 Cloudflare 或 Google Play 的紀錄。"],["限制","無法保證偵測所有追蹤或阻止一切秘密錄音。"],["聯絡方式","cigdemkabakci01@gmail.com"]]]
};
const sel=document.querySelector("#lang");for(const [code,v] of Object.entries(D)){const o=document.createElement("option");o.value=code;o.textContent=v[0];sel.append(o)}function pick(){let a=navigator.languages||[navigator.language||"en"];for(let x of a){if(D[x])return x;let b=x.split("-")[0];if(D[b])return b;if(b==="zh")return "zh-TW";if(b==="pt")return "pt-BR"}return "en"}function render(code){const v=D[code]||D.en;document.documentElement.lang=code;document.documentElement.dir=code==="ar"?"rtl":"ltr";document.querySelector("#sub").textContent=v[1];document.querySelector("#intro").textContent=v[2];document.querySelector("#content").replaceChildren();for(let [h,p] of v[3]){let title=document.createElement("h2");title.textContent=h;let para=document.createElement("p");para.textContent=p;document.querySelector("#content").append(title,para)}sel.value=code}sel.addEventListener("change",()=>render(sel.value));render(pick());
</script></html>
